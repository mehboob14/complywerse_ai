# Staging stack — runs alongside an existing production deployment on the
# same droplet with zero shared state. Postgres, Redis, the API and the
# Next.js frontend all live on a private Docker network (grc-stg-net);
# only the frontend's HTTP port is exposed to the host (configurable via
# PUBLIC_PORT, default 8080).
#
# Bring up:        docker compose -p grc-stg --env-file .env.staging -f docker-compose.staging.yml up -d --build
# Tear down:       docker compose -p grc-stg --env-file .env.staging -f docker-compose.staging.yml down
# Wipe & restart:  add -v to `down` to drop the postgres + uploads volumes.

name: grc-stg

services:
  postgres:
    image: postgres:15-alpine
    container_name: grc-stg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
      # First-boot initdb on a small / busy droplet can easily take 60+ s.
      # start_period gives Postgres that window before failing healthchecks
      # start counting toward the retry limit.
      start_period: 90s
    networks: [grc-stg-net]

  redis:
    image: redis:7-alpine
    container_name: grc-stg-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [grc-stg-net]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: grc-stg-backend:latest
    container_name: grc-stg-backend
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    environment:
      # ---- Database (Docker-internal hostname `postgres`) ----
      MASTER_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      TENANT_DB_URL_TEMPLATE: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/grc_{slug}
      POSTGRES_ADMIN_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/postgres

      # ---- Redis ----
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2

      # ---- Auth / cookies ----
      SESSION_SECRET: ${SESSION_SECRET}
      AUTH_COOKIE_DOMAIN: ""
      REPL_DEPLOYMENT: "0"

      # ---- CORS — accept the staging origin (IP:port) ----
      ALLOWED_ORIGIN_REGEX: ${ALLOWED_ORIGIN_REGEX}

      # ---- AI / LLM (optional but required for AI-assist features) ----
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      AI_INTEGRATIONS_OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_INTEGRATIONS_OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}

      # ---- Background workers — keep light for staging ----
      # Defaults match prod; override per-deploy via .env.staging.
      DISABLE_EMBEDDED_WORKFLOW_RUNTIME: "${DISABLE_EMBEDDED_WORKFLOW_RUNTIME:-0}"
      DISABLE_COMPLYCHAT_EMBED_WORKER: "${DISABLE_COMPLYCHAT_EMBED_WORKER:-1}"

      # ---- Tenant routing ----
      # Resolves every IP-only request to this tenant when no subdomain /
      # X-Tenant-Slug / cookie is present. Leave empty for multi-tenant.
      DEFAULT_TENANT_SLUG: "${DEFAULT_TENANT_SLUG:-}"
    volumes:
      - backend_uploads:/app/uploads
      # NCA reference templates live at the repo root and are intentionally
      # NOT in the backend build context (which is ./backend), so the image
      # itself doesn't ship them. Mount the host directory read-only so the
      # templates catalogue endpoint can enumerate the .docx/.xlsx files;
      # _resolve_templates_dir() walks up from /app/grc/routers/... and
      # finds /app/NCA_Templates without any code change.
      - ./NCA_Templates:/app/NCA_Templates:ro
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4000/grc/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [grc-stg-net]

  frontend:
    build:
      context: ./grc-frontend
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* values are baked at build time, so they go in args.
      # BACKEND_URL is also baked because next.config.js rewrites store the
      # resolved destination in routes-manifest.json during `next build`.
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL}
        NEXT_PUBLIC_API_BASE_URL: /api
        BACKEND_URL: http://backend:4000
    image: grc-stg-frontend:latest
    container_name: grc-stg-frontend
    restart: unless-stopped
    depends_on:
      backend: { condition: service_started }
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      # Server-side proxy target for /api/* — uses the Docker DNS name.
      BACKEND_URL: http://backend:4000
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL}
      NEXT_PUBLIC_API_BASE_URL: /api
    ports:
      # ONLY port exposed to the host. Change PUBLIC_PORT in .env.staging
      # if 8080 is already taken.
      - "${PUBLIC_PORT:-8080}:3000"
    networks: [grc-stg-net]

volumes:
  pg_data:
    name: grc-stg-pg-data
  backend_uploads:
    name: grc-stg-backend-uploads

networks:
  grc-stg-net:
    name: grc-stg-net
    driver: bridge
