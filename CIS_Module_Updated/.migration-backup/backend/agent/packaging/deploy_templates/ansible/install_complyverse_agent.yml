# =============================================================================
# Compliverse Agent — Ansible mass deploy playbook (Linux)
# =============================================================================
#
# Inventory: pass a host group with `enroll_token` + `cv_backend_url` as
# host_vars. The Compliverse dashboard's bulk-enroll CSV can be converted
# to host_vars YAML via the small `csv-to-hostvars.py` helper in this dir.
#
# Usage:
#   ansible-playbook -i inventory.ini install_complyverse_agent.yml
#
# Requires: Ansible 2.12+ on the controller. No agent on managed nodes —
# Ansible uses SSH.
# =============================================================================

- name: Install + enroll Compliverse compliance agent
  hosts: compliverse_targets
  become: true
  vars:
    cv_package: complyverse-agent_1.0.0_all.deb
    cv_package_url: https://artifacts.compliverse.app/agent/{{ cv_package }}
    cv_local_tmp: /tmp/{{ cv_package }}
    cv_backend_url: https://your-tenant.compliverse.app

  tasks:
    - name: Ensure prerequisites present (Debian/Ubuntu)
      apt:
        name: ['python3', 'python3-cryptography', 'python3-paramiko']
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Ensure prerequisites present (RHEL/Alma/Rocky)
      yum:
        name: ['python3', 'python3-cryptography', 'python3-paramiko']
        state: present
      when: ansible_os_family == "RedHat"

    - name: Fetch package
      get_url:
        url: "{{ cv_package_url }}"
        dest: "{{ cv_local_tmp }}"
        mode: '0644'
        force: no   # cache friendly

    - name: Install Debian package
      apt:
        deb: "{{ cv_local_tmp }}"
        state: present
      when: ansible_os_family == "Debian"

    - name: Install RHEL package
      yum:
        name: "{{ cv_local_tmp }}"
        state: present
      when: ansible_os_family == "RedHat"

    - name: Check enrollment status
      command: /opt/complyverse-agent/bin/complyverse-agent status
      register: cv_status
      changed_when: false
      failed_when: false
      become_user: complyverse

    - name: Enroll with cloud (only if not enrolled yet)
      command: >
        /opt/complyverse-agent/bin/complyverse-agent enroll
          --backend {{ cv_backend_url }}
          --token {{ enroll_token }}
      when: "'NOT ENROLLED' in cv_status.stdout"
      become_user: complyverse
      no_log: true   # never echo the token to ansible's stdout

    - name: Enable + start systemd service
      systemd:
        name: complyverse-agent
        state: started
        enabled: yes
        daemon_reload: yes
