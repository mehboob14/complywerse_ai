# Metabase — local / sidecar Analytics for ComplyVerse Reports
#
# Production: run behind TLS, set a strong MB_DB password, and point
# METABASE_SITE_URL at the public URL.
#
# Licence: Metabase OSS is AGPL-3.0. JWT SSO / interactive embed need Pro.
# OSS path: Open Analytics deep-link + static signed embeds.

services:
  metabase-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: ${MB_DB_PASSWORD:-metabase_dev_change_me}
      POSTGRES_DB: metabaseappdb
    volumes:
      - metabase_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase -d metabaseappdb"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Local SMTP catcher for dashboard subscription smoke tests (UI: :8025)
  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "${MAILHOG_UI_PORT:-8025}:8025"
      - "${MAILHOG_SMTP_PORT:-1025}:1025"

  metabase:
    image: metabase/metabase:v0.53.6
    depends_on:
      metabase-db:
        condition: service_healthy
      mailhog:
        condition: service_started
    ports:
      - "${METABASE_HOST_PORT:-3001}:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabaseappdb
      MB_DB_PORT: 5432
      MB_DB_USER: metabase
      MB_DB_PASS: ${MB_DB_PASSWORD:-metabase_dev_change_me}
      MB_DB_HOST: metabase-db
      MB_EMAIL_SMTP_HOST: mailhog
      MB_EMAIL_SMTP_PORT: 1025
      MB_EMAIL_SMTP_SECURITY: none
      MB_EMAIL_FROM_ADDRESS: analytics@complyverse.local
      JAVA_TIMEZONE: UTC
    volumes:
      - metabase_data:/metabase-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

volumes:
  metabase_pg:
  metabase_data:
