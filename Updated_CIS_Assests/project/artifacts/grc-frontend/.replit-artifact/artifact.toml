kind = "web"
previewPath = "/"
title = "CompliverseAI GRC Platform"
version = "1.0.0"
id = "artifacts/grc-frontend"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20080

[services.development]
run = "pnpm --filter @workspace/grc-frontend run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/grc-frontend", "run", "build" ]
publicDir = "artifacts/grc-frontend/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20080"
BASE_PATH = "/"
